{{- /*
  We render an OIDC client-secret Secret only when the operator
  passed an inline `auth.oidc.clientSecret` *and* didn't point us
  at a pre-existing Secret. The deployment.yaml always references
  the same Secret name; downstream the user can decide whether
  this chart owns it or they manage it externally.
*/ -}}
{{- if and (eq .Values.auth.mode "oidc") .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpg-cp.fullname" . }}-oidc
  labels:
    {{- include "mcpg-cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  client_secret: {{ .Values.auth.oidc.clientSecret | quote }}
{{- end }}
