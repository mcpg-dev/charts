{{- /*
  RBAC for the optional KubeProvider — list/watch on MCPGGateway
  CRDs across the cluster (or a single namespace).
  Read-only; the CP never mutates operator-owned resources. The
  KubeProvider is the only feature that needs cluster-API access,
  so we render this stack only when it's enabled.
*/ -}}
{{- if .Values.cp.kubeProvider.enabled -}}
{{- if .Values.cp.kubeProvider.namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcpg-cp.fullname" . }}-kube-provider
  namespace: {{ .Values.cp.kubeProvider.namespace }}
  labels:
    {{- include "mcpg-cp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["mcpg.dev"]
    resources: ["mcpggateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcpg-cp.fullname" . }}-kube-provider
  namespace: {{ .Values.cp.kubeProvider.namespace }}
  labels:
    {{- include "mcpg-cp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcpg-cp.fullname" . }}-kube-provider
subjects:
  - kind: ServiceAccount
    name: {{ include "mcpg-cp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcpg-cp.fullname" . }}-kube-provider
  labels:
    {{- include "mcpg-cp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["mcpg.dev"]
    resources: ["mcpggateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcpg-cp.fullname" . }}-kube-provider
  labels:
    {{- include "mcpg-cp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcpg-cp.fullname" . }}-kube-provider
subjects:
  - kind: ServiceAccount
    name: {{ include "mcpg-cp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
