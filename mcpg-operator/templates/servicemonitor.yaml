{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcpg-operator.fullname" . }}
  namespace: {{ default (include "mcpg-operator.namespace" .) .Values.serviceMonitor.namespace }}
  labels:
    {{- include "mcpg-operator.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mcpg-operator.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "mcpg-operator.namespace" . }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: https
      tlsConfig:
        insecureSkipVerify: true   # operator pin: cert-manager-managed cert
{{- end }}
