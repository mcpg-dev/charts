{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcpg-operator.serviceAccountName" . }}
  namespace: {{ include "mcpg-operator.namespace" . }}
  labels:
    {{- include "mcpg-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# SA-level automount is OFF; the operator's Deployment turns it
# on at the pod level. This means any other pod that gets
# (mis)bound to this SA does NOT inherit the operator's API
# credentials by default — defence-in-depth against drift.
automountServiceAccountToken: false
{{- end }}
