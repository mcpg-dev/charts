apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mcpg.fullname" . }}-test-connection"
  labels:
    {{- include "mcpg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
        - --spider
        - --timeout=5
        - "http://{{ include "mcpg.fullname" . }}:{{ .Values.service.port }}{{ .Values.config.gateway.server.health_path | default "/health" }}"
