{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) .Values.tls.certBase64 .Values.tls.keyBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpg.fullname" . }}-tls
  labels:
    {{- include "mcpg.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.certBase64 }}
  tls.key: {{ .Values.tls.keyBase64 }}
{{- end }}
