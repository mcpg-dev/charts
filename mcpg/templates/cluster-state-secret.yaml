{{- /*
  State-encryption key for the auto-wired coordinator paths. The gateway
  refuses a clustered boot without key material, so whenever the auto-wire
  is active the deployment injects this Secret as MCPG_CLUSTER_STATE_KEY
  and the auto-wired cluster block names that env var in
  `state_encryption_key_env` — clustered state is sealed by default.

  `lookup` reuses the key already on the cluster, so `helm upgrade` never
  rotates it (a rotated key would orphan every sealed record). A plain
  `helm template` has no cluster to look at and mints a fresh key every
  render — template-only pipelines pin cluster.stateEncryption.existingSecret
  instead.

  Key material: 32 random bytes as URL-safe base64 — the only alphabet the
  gateway's loader decodes (sprig randBytes emits the +/ alphabet, hence
  the replaces); the trailing `=` padding is accepted.
*/ -}}
{{- if and (include "mcpg.autoWiredCluster" .) (not .Values.cluster.stateEncryption.existingSecret) }}
{{- $name := include "mcpg.stateKeySecretName" . }}
{{- $key := include "mcpg.stateKeySecretKey" . }}
{{- $value := "" }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
  {{- $value = index (.data | default dict) $key | default "" }}
{{- end }}
{{- if not $value }}
  {{- $value = randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mcpg.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
